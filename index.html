<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <title>Masterclass Debian — 100 Commandes Progressives</title>
    <style>
        :root {
            --debian-red: #A80030;
            --bg: #0d1117;
            --card-bg: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --text-bright: #ffffff;
            --accent: #58a6ff;
            --code-bg: #010409;
            --code-color: #7ee787;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--debian-red);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1 { color: var(--text-bright); margin-bottom: 5px; }
        .subtitle { color: #8b949e; font-size: 1.1rem; }

        .level-header {
            background: linear-gradient(90deg, var(--debian-red), transparent);
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            margin-top: 40px;
            font-size: 1.3rem;
            font-weight: bold;
        }

        .command-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 15px 20px;
            margin-top: 15px;
            transition: border-color 0.2s;
        }

        .command-card:hover {
            border-color: var(--accent);
        }

        .cmd-title {
            font-size: 1.1rem;
            color: var(--accent);
            font-family: monospace;
            font-weight: bold;
        }

        .cmd-desc { margin: 8px 0; }

        .example-block {
            background-color: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 8px 12px;
            font-family: monospace;
            color: var(--code-color);
            font-size: 0.9rem;
            overflow-x: auto;
        }

        .exercise-box {
            background-color: rgba(56, 139, 253, 0.1);
            border-left: 3px solid var(--accent);
            padding: 10px 15px;
            margin-top: 10px;
            border-radius: 0 4px 4px 0;
        }

        button {
            background-color: #21262d;
            color: var(--text-bright);
            border: 1px solid var(--border);
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 8px;
            font-size: 0.85rem;
        }

        button:hover { background-color: #30363d; }

        .solution {
            display: none;
            background-color: var(--code-bg);
            color: var(--code-color);
            font-family: monospace;
            padding: 8px 12px;
            border-radius: 4px;
            margin-top: 8px;
            border: 1px solid var(--border);
        }
    </style>
</head>

function renderPage() {
    const root = document.getElementById('tp-content');
    let currentLvl = "";

    dataset.forEach((item, index) => {
        if (item.lvl !== currentLvl) {
            currentLvl = item.lvl;
            const lvlHeader = document.createElement('div');
            lvlHeader.className = 'level-header';
            lvlHeader.innerText = currentLvl;
            root.appendChild(lvlHeader);
        }

        const card = document.createElement('div');
        card.className = 'command-card';
        card.innerHTML = `
            <div class="cmd-title">${index + 1}. Commande : ${item.cmd}</div>
            <div class="cmd-desc">${item.desc}</div>
            <div class="example-block">$ ${item.ex}</div>
            <div class="exercise-box">
                <strong>Exercice Pratique :</strong> ${item.q}<br>
                <button onclick="toggleSol(${index})">Voir la commande solution</button>
                <div id="sol-${index}" class="solution"># Solution minimale :\n${item.ex}</div>
            </div>
        `;
        root.appendChild(card);
    });
}

function toggleSol(idx) {
    const el = document.getElementById(`sol-${idx}`);
    el.style.display = (el.style.display === "block") ? "none" : "block";
}

window.onload = renderPage;
</script>
